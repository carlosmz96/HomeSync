services:
  postgres:
    image: postgres:18
    container_name: homesync-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - homesync_pgdata:/var/lib/postgresql

volumes:
  homesync_pgdata: